name: Unity Build

on:
  push:
    branches:
      - test-ci # Trigger workflow only on the test-ci branch
  pull_request:
    branches:
      - test-ci
  workflow_dispatch: # Allow manual triggering of the workflow

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }} # Unity account email
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }} # Unity account password
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # Unity license file

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Cache Unity Library
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('**/*.cs') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Step 3: Build for Android
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android # Build target platform
          androidExportType: androidPackage # Export as APK

      # Step 4: Build for WebGL
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL # Build target platform

      # Step 5: Upload Android Artifact
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: build/Android # Path to the Android build output

      # Step 6: Upload WebGL Artifact
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL
          path: build/WebGL # Path to the WebGL build output